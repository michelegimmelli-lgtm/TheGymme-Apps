<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#111318">
  <title>Apri routine · TG Interval</title>
  <style>
    :root{color-scheme:dark;font-family:Inter,system-ui,-apple-system,sans-serif}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#111318;color:#f7f7f8;padding:24px}
    main{width:min(100%,520px);background:#1b1e25;border:1px solid #343844;border-radius:24px;padding:28px;box-shadow:0 20px 60px #0008}
    .mark{width:72px;height:72px;border-radius:20px;display:grid;place-items:center;background:#fff;color:#111;font-weight:900;font-size:25px;margin-bottom:22px}
    h1{font-size:28px;margin:0 0 10px}
    p{color:#c8cbd3;line-height:1.5;margin:0 0 22px}
    a{width:100%;border:0;border-radius:14px;padding:16px 18px;font:inherit;font-weight:800;text-align:center;text-decoration:none;cursor:pointer;display:block}
    #open{background:linear-gradient(135deg,#ef233c,#b00020);color:#fff;margin-bottom:16px}
    #download{background:#2a2e38;color:#fff;border:1px solid #454a58}
    #status{font-size:14px;margin-top:18px;color:#aeb2bc;line-height:1.45}
    #status.error{padding:12px 14px;color:#ffd5da;background:#451923;border:1px solid #9f2940;border-radius:12px}
    small{display:block;color:#858a96;margin-top:20px;line-height:1.45}
  </style>
</head>
<body>
<main>
  <div class="mark">TG</div>
  <h1>Routine TG Interval</h1>
  <p>Apri TG Interval per importare questa routine direttamente sul telefono.</p>
  <a id="open" href="#">Apri in TG Interval</a>
  <a id="download" href="../downloads/interval-latest.apk" download>Scarica l’ultima APK di Interval</a>
  <div id="status" role="status" aria-live="polite">Sto verificando il collegamento…</div>
  <small>La routine è contenuta nel link e non viene caricata sui nostri server.</small>
</main>
<script>
(() => {
  const params = new URLSearchParams(location.hash.slice(1));
  const token = params.get("share");
  const open = document.getElementById("open");
  const download = document.getElementById("download");
  const status = document.getElementById("status");
  let intervalRelease = null;
  let launchTimer = 0;

  const setStatus = (message, isError = false) => {
    status.textContent = message;
    status.className = isError ? "error" : "";
  };

  if (!token || !/^[jz]\.[A-Za-z0-9_-]+$/.test(token)) {
    open.hidden = true;
    setStatus("Il link della routine non è valido o è incompleto.", true);
  } else {
    const appUrl = "com.thegymme.interval://load#share=" + token;
    open.href = appUrl;

    const cancelMissingAppCheck = () => {
      if (launchTimer) window.clearTimeout(launchTimer);
      launchTimer = 0;
    };

    const markAppOpened = () => {
      if (!document.hidden) return;
      cancelMissingAppCheck();
      setStatus("TG Interval si sta aprendo…");
    };

    document.addEventListener("visibilitychange", markAppOpened);
    window.addEventListener("pagehide", cancelMissingAppCheck);

    const attemptOpen = event => {
      if (event) event.preventDefault();
      cancelMissingAppCheck();
      setStatus("Apertura di TG Interval…");
      window.location.href = appUrl;
      launchTimer = window.setTimeout(() => {
        if (document.hidden) return;
        setStatus("App non installata. Scarica TG Interval, installala e poi riapri questo link per importare la routine.", true);
      }, 2400);
    };

    open.addEventListener("click", attemptOpen);
    window.setTimeout(() => attemptOpen(), 350);
  }

  fetch("../downloads/releases.json", { cache: "no-store" })
    .then(response => response.ok ? response.json() : Promise.reject())
    .then(releases => {
      intervalRelease = releases.interval || null;
      if (!intervalRelease?.file) throw new Error();
      download.href = "../" + intervalRelease.file;
      download.download = intervalRelease.filename || "TheGymme-Interval.apk";
    })
    .catch(() => {
      intervalRelease = {
        file: "downloads/interval-latest.apk",
        filename: "TheGymme-Interval.apk"
      };
    });

  download.addEventListener("click", async event => {
    event.preventDefault();
    if (download.getAttribute("aria-busy") === "true") return;
    const release = intervalRelease || {
      file: "downloads/interval-latest.apk",
      filename: "TheGymme-Interval.apk"
    };
    download.setAttribute("aria-busy", "true");
    try {
      const response = await fetch("../" + release.file, { cache: "no-store" });
      if (!response.ok || !response.body) throw new Error();
      const total = Number(response.headers.get("content-length")) || 0;
      const reader = response.body.getReader();
      const chunks = [];
      let received = 0;
      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        chunks.push(value);
        received += value.length;
        download.textContent = total
          ? `Scarico… ${Math.min(100, Math.round(received / total * 100))}%`
          : "Scarico…";
      }
      const blob = new Blob(chunks, {
        type: response.headers.get("content-type") || "application/vnd.android.package-archive"
      });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = release.filename || "TheGymme-Interval.apk";
      document.body.append(link);
      link.click();
      link.remove();
      window.setTimeout(() => URL.revokeObjectURL(url), 60000);
      download.textContent = "Download completato";
      setStatus("APK ricevuta completamente. Ora puoi aprirla e installare TG Interval.");
      window.setTimeout(() => {
        download.textContent = "Scarica l’ultima APK di Interval";
      }, 2500);
    } catch {
      download.textContent = "Riprova download";
      setStatus("Download non riuscito. Controlla la connessione e riprova.", true);
    } finally {
      download.removeAttribute("aria-busy");
    }
  });
})();
</script>
</body>
</html>
