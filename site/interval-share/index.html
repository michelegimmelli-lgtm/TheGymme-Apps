<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#111318">
  <title>Apri routine · TG Interval</title>
  <style>
    :root{color-scheme:dark;font-family:Inter,system-ui,-apple-system,sans-serif}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#111318;color:#f7f7f8;padding:24px}
    main{width:min(100%,520px);background:#1b1e25;border:1px solid #343844;border-radius:24px;padding:28px;box-shadow:0 20px 60px #0008}
    .mark{width:72px;height:72px;border-radius:20px;display:grid;place-items:center;background:#fff;color:#111;font-weight:900;font-size:25px;margin-bottom:22px}
    h1{font-size:28px;margin:0 0 10px}p{color:#c8cbd3;line-height:1.5;margin:0 0 22px}
    a{width:100%;border:0;border-radius:14px;padding:16px 18px;font:inherit;font-weight:800;text-align:center;text-decoration:none;cursor:pointer;display:block}
    #open{background:linear-gradient(135deg,#ef233c,#b00020);color:#fff;margin-bottom:12px}
    #download{background:#2a2e38;color:#fff;border:1px solid #454a58}
    #status{font-size:14px;margin-top:18px;color:#aeb2bc}.error{color:#ff9aa7!important}
    small{display:block;color:#858a96;margin-top:20px;line-height:1.45}
  </style>
</head>
<body>
<main>
  <div class="mark">TG</div>
  <h1>Routine TG Interval</h1>
  <p>Apri TG Interval per importare questa routine direttamente sul telefono.</p>
  <a id="open" href="#">Apri in TG Interval</a>
  <a id="download" href="https://github.com/michelegimmelli-lgtm/TheGymme-Apps/releases">Scarica TG Interval</a>
  <div id="status" role="status">Sto verificando il collegamento…</div>
  <small>La routine è contenuta nel link e non viene caricata sui nostri server.</small>
</main>
<script>
(() => {
  const params = new URLSearchParams(location.hash.slice(1));
  const token = params.get("share");
  const open = document.getElementById("open");
  const download = document.getElementById("download");
  const status = document.getElementById("status");
  if (!token || !/^[jz]\.[A-Za-z0-9_-]+$/.test(token)) {
    open.hidden = true;
    status.textContent = "Il link della routine non è valido o è incompleto.";
    status.className = "error";
    return;
  }
  const appUrl = "com.thegymme.interval://load#share=" + token;
  open.href = appUrl;
  open.addEventListener("click", () => { status.textContent = "Apertura di TG Interval…"; });
  fetch("https://api.github.com/repos/michelegimmelli-lgtm/TheGymme-Apps/releases?per_page=30", {headers:{Accept:"application/vnd.github+json"}})
    .then(response => response.ok ? response.json() : Promise.reject())
    .then(releases => {
      const release = releases.find(item => !item.draft && String(item.tag_name || "").startsWith("interval-apk-v"));
      const apk = release?.assets?.find(asset => /TheGymme-Interval-.*-release\.apk$/.test(asset.name));
      if (apk?.browser_download_url) download.href = apk.browser_download_url;
    }).catch(() => {});
  window.setTimeout(() => {
    status.textContent = "Se l’app non si apre automaticamente, tocca Apri in TG Interval.";
    location.href = appUrl;
  }, 250);
})();
</script>
</body>
</html>
